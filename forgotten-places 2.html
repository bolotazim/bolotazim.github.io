<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgotten Places — App Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500..700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#1C2526;--paper:#F4EEE3;--sand:#E9E0CF;--card:#FBF8F2;--terra:#A9441F;--teal:#2C6E6A;--muted:#55605F;--line:#DCD2C0;
--green:#3E8E5A;--yellow:#D9A520;--red:#C0392B;--blue:#2F6FB0;}
*{box-sizing:border-box}
html,body{margin:0;background:#D9D0BF;font-family:'DM Sans',Arial,sans-serif;color:var(--ink);}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:440px;min-height:100vh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(0,0,0,.12)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:'EB Garamond',Georgia,serif;font-size:24px;font-weight:600;line-height:1}
.brand small{display:block;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:1.5px;color:#C9D6D2;font-weight:500;margin-top:4px}
.langsel{display:flex;gap:4px}
.langsel button{border:1px solid #4A5A5B;background:transparent;color:#C9D6D2;border-radius:8px;padding:5px 7px;font-size:12px;font-weight:600;cursor:pointer}
.langsel button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
main{flex:1;padding:16px 16px 96px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:6}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--terra)}
nav.tabs .badge{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;margin-left:2px}
h2{font-family:'EB Garamond',Georgia,serif;font-size:28px;font-weight:600;margin:4px 0 6px;line-height:1.1}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:'EB Garamond',Georgia,serif;font-size:26px;line-height:1}
.stat span{font-size:11px;color:var(--muted);line-height:1.2;display:block;margin-top:4px}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
select,input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;font-size:14px}
textarea{min-height:84px;resize:vertical}
.mapwrap{background:#E3EBE6;border-radius:18px;overflow:hidden;position:relative;border:1px solid var(--line)}
.mapwrap svg{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:600;cursor:pointer;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pt{cursor:pointer}
.pt:hover circle.dot{stroke-width:5}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin:10px 2px 16px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;border:1px solid transparent;text-align:left;width:100%}
.item:hover{border-color:var(--line)}
.thumb{width:64px;height:64px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;background:linear-gradient(135deg,#E9E0CF,#D6C7AC)}
.thumb img{width:100%;height:100%;object-fit:cover}
.item h3{margin:0 0 4px;font-size:16px;font-weight:600;line-height:1.2}
.meta{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;color:#fff}
.pill.yellow{color:#2A2100}
.vbadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--teal)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;cursor:pointer;background:var(--terra);color:#F7F1E6;width:100%}
.btn.teal{background:var(--teal)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.small{width:auto;padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px}
.row>*{flex:1}
.empty{background:var(--card);border-radius:16px;padding:24px;text-align:center;color:var(--muted);font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.4}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.urg{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:14px;border-left:6px solid var(--red)}
.urg .ph{height:130px;display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,#E9D3C8,#C9A08B)}
.urg .ph img{width:100%;height:100%;object-fit:cover}
.urg .bd{padding:14px}
.urg h3{margin:0 0 4px;font-size:18px}
.urg p{margin:8px 0 12px;font-size:14px;line-height:1.4}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(20,28,29,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:440px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:0 0 24px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .hero{height:170px;display:flex;align-items:center;justify-content:center;font-size:72px;background:linear-gradient(135deg,#E9E0CF,#CDB894);position:relative}
.sheet .hero img{width:100%;height:100%;object-fit:cover}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(28,37,38,.75);color:#fff;font-size:18px;cursor:pointer}
.sheet .in{padding:16px}
.sheet h2{font-size:30px}
.desc{font-size:15px;line-height:1.5;margin:10px 0}
.problem{background:#F6DCD5;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4;margin:10px 0}
.problem.y{background:#F5E8C4}
.kv{font-size:13px;color:var(--muted);margin:6px 0}
.ltabs{display:flex;gap:6px;margin:12px 0 0}
.ltabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 4px;font-size:13px;font-weight:600;cursor:pointer}
.ltabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.box{background:var(--card);border-radius:16px;padding:14px;margin-top:14px}
.box h4{margin:0 0 8px;font-size:15px}
.prog{height:8px;background:var(--sand);border-radius:6px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--teal)}
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto;margin-bottom:10px}
.bu,.bm{padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.4;max-width:85%;white-space:pre-wrap}
.bu{align-self:flex-end;background:var(--teal);color:#F4EEE3}
.bm{align-self:flex-start;background:var(--sand)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:5px 10px;font-size:12px;cursor:pointer}
.appeal{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-family:Georgia,serif;font-size:13px;line-height:1.5;max-height:340px;overflow:auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.mod{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px}
.mod .top{display:flex;gap:12px}
.mod p{font-size:14px;margin:8px 0;line-height:1.4}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.search{margin-bottom:8px;font-size:15px;padding:11px 12px}
.srclink{display:inline-block;margin:4px 0 8px;font-size:14px;font-weight:600;color:var(--teal);text-decoration:none}
.srclink:hover{text-decoration:underline}
.demo{background:#F5E8C4;border-radius:12px;padding:8px 12px;font-size:12px;line-height:1.4;margin-bottom:12px;color:#4A3B00}

.grid{display:block}
.grid>.urg,.grid>.mod{margin-bottom:14px}
@media (min-width:900px){
  html,body{background:var(--paper)}
  .app{max-width:none;box-shadow:none}
  header{padding:14px 28px}
  .brand{font-size:28px}
  nav.tabs{top:70px;bottom:0;left:0;transform:none;width:220px;max-width:none;display:flex;flex-direction:column;gap:4px;padding:16px 12px;border-top:0;border-right:1px solid var(--line)}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:15px;border-radius:12px}
  nav.tabs button.on{background:var(--paper)}
  main{margin-left:220px;padding:24px 32px 32px}
  h2{font-size:36px}
  .sub{font-size:16px;max-width:760px}
  .mapview{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
  .mv-right{position:sticky;top:86px;max-height:calc(100vh - 110px);overflow:auto;padding-right:4px}
  .mapview .mapwrap svg{height:calc(100vh - 290px);min-height:420px}
  .filters{max-width:760px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;align-items:start}
  .grid>.urg,.grid>.mod{margin:0}
  .addview{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:28px;align-items:start}
  .av-map{position:sticky;top:86px}
  .addview .mapwrap svg{height:calc(100vh - 320px);min-height:380px}
  .addview form label.f:first-child{margin-top:0}
  .overlay{align-items:stretch;justify-content:flex-end}
  .sheet{max-width:520px;max-height:none;height:100vh;border-radius:0;animation:side .22s ease-out}
  .toast{bottom:28px;left:calc(50% + 110px)}
}
@keyframes side{from{transform:translateX(40px);opacity:.6}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand" id="brand">Forgotten Places<small>KYRGYZSTAN HERITAGE MAP</small></div>
  <div class="langsel" id="langsel"></div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
</div>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

const BORDER=[[71.0,42.78],[71.9,42.62],[73.45,42.48],[73.55,43.03],[74.3,43.25],[75.7,42.85],[76.9,42.98],[78.0,42.88],[79.2,42.78],[80.25,42.2],[80.1,42.0],[79.3,41.8],[78.4,41.4],[77.6,41.0],[76.8,40.95],[76.3,40.4],[75.6,40.65],[74.9,40.5],[74.2,40.1],[73.8,39.75],[73.6,39.45],[72.8,39.35],[72.0,39.35],[71.2,39.55],[70.5,39.6],[69.6,39.6],[69.3,39.9],[69.6,40.2],[70.7,40.25],[71.7,40.2],[72.3,40.45],[72.75,40.62],[72.95,40.8],[72.85,40.98],[72.4,41.1],[71.9,41.3],[71.3,41.2],[70.8,41.45],[71.05,41.95],[70.95,42.3]];
const VIEWS={};
const getV=key=>VIEWS[key]||(VIEWS[key]={x:0,y:0,w:1100,h:560});
const sc=(x,y,k,inner)=>`<g data-sx="${x.toFixed(1)}" data-sy="${y.toFixed(1)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${k})">${inner}</g>`;
function mapSVG(sites,opts={}){
  const key=opts.key||"main", v=getV(key), k=v.w/1100;
  const poly=BORDER.map(p=>X(p[0]).toFixed(0)+","+Y(p[1]).toFixed(0)).join(" ");
  let pts=sites.map(s=>{
    const c=STATUS[s.status].color;
    return `<g class="pt" data-id="${s.id}">`+sc(X(s.lon),Y(s.lat),k,`
      ${verified(s)?`<circle r="38" fill="none" stroke="#2C6E6A" stroke-width="5" stroke-dasharray="7 5"/>`:""}
      <circle class="dot" r="29" fill="${c}" stroke="#FBF8F2" stroke-width="5"/>
      <text y="10" text-anchor="middle" font-size="30">${TYPES[s.type].icon}</text>`)+`</g>`}).join("");
  if(opts.pick) pts+=sc(X(opts.pick.lon),Y(opts.pick.lat),k,`<circle r="26" fill="#A9441F" stroke="#fff" stroke-width="6"/><circle r="8" fill="#fff"/>`);
  const city=(name,lon,lat,dy)=>sc(X(lon),Y(lat),k,`<circle r="8" fill="#1C2526"/><text x="-14" y="${dy}" text-anchor="end" font-size="28" font-weight="600" fill="#1C2526" font-family="DM Sans, Arial, sans-serif">${esc(name)}</text>`);
  return `<svg viewBox="${v.x} ${v.y} ${v.w} ${v.h}" data-key="${key}" ${opts.id?`id="${opts.id}"`:""} role="img" aria-label="${esc(t("mapAria"))}">
    <rect x="-3000" y="-3000" width="7100" height="6560" fill="#E3EBE6"/>
    <polygon points="${poly}" fill="#F7F2E8" stroke="#9E8F75" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <ellipse cx="798" cy="128" rx="108" ry="30" transform="rotate(-6 798 128)" fill="#9CC3C9"/>
    ${sc(805,166,k,`<text text-anchor="middle" font-size="24" fill="#2C5A60" font-family="DM Sans, Arial, sans-serif">${esc(t("issykkul"))}</text>`)}
    ${city(t("bishkek"),74.59,42.87,-14)}${city(t("osh"),72.80,40.53,34)}
    ${pts}</svg>`;
}
function zoomCtl(){return `<div class="zoom"><button type="button" data-z="in" aria-label="${esc(t("zIn"))}">+</button><button type="button" data-z="out" aria-label="${esc(t("zOut"))}">−</button><button type="button" data-z="reset" aria-label="${esc(t("zReset"))}">⟲</button></div>`}
function applyV(svg){const v=getV(svg.dataset.key);svg.setAttribute("viewBox",`${v.x} ${v.y} ${v.w} ${v.h}`);const k=v.w/1100;
  svg.querySelectorAll("[data-sx]").forEach(g=>g.setAttribute("transform",`translate(${g.dataset.sx},${g.dataset.sy}) scale(${k})`))}
function clampV(v){v.w=Math.min(1100,Math.max(110,v.w));v.h=v.w*560/1100;
  v.x=Math.min(1100-v.w*0.5,Math.max(-v.w*0.5,v.x));v.y=Math.min(560-v.h*0.5,Math.max(-v.h*0.5,v.y));if(v.w>=1100){v.x=0;v.y=0}}
function zoomAt(svg,f,cx,cy){const v=getV(svg.dataset.key);const nw=Math.min(1100,Math.max(110,v.w/f));const r=nw/v.w;
  v.x=cx-(cx-v.x)*r;v.y=cy-(cy-v.y)*r;v.w=nw;clampV(v);applyV(svg)}
function svgPoint(svg,evt){const p=svg.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function attachZoom(wrap){
  const svg=wrap.querySelector("svg");const P=new Map();let pinch=null;svg._moved=0;
  wrap.querySelector(".zoom").onclick=e=>{const b=e.target.closest("button");if(!b)return;e.stopPropagation();const v=getV(svg.dataset.key);
    if(b.dataset.z==="reset"){v.x=0;v.y=0;v.w=1100;clampV(v);applyV(svg);return}
    zoomAt(svg,b.dataset.z==="in"?1.6:1/1.6,v.x+v.w/2,v.y+v.h/2)};
  svg.addEventListener("wheel",e=>{e.preventDefault();const p=svgPoint(svg,e);zoomAt(svg,e.deltaY<0?1.25:0.8,p.x,p.y)},{passive:false});
  svg.addEventListener("pointerdown",e=>{P.set(e.pointerId,{x:e.clientX,y:e.clientY});svg._moved=0;if(P.size===2){const [a,b]=[...P.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
  svg.addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;const last=P.get(e.pointerId);const v=getV(svg.dataset.key);
    if(P.size===1){const u=Math.max(v.w/svg.clientWidth,v.h/svg.clientHeight);const dx=e.clientX-last.x,dy=e.clientY-last.y;svg._moved+=Math.abs(dx)+Math.abs(dy);
      if(svg._moved>6){v.x-=dx*u;v.y-=dy*u;clampV(v);applyV(svg)}}
    P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===2&&pinch){const [a,b]=[...P.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const mid=svgPoint(svg,{clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2});
      zoomAt(svg,d/pinch,mid.x,mid.y);pinch=d;svg._moved=99}});
  const up=e=>{P.delete(e.pointerId);if(P.size<2)pinch=null};
  svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);svg.addEventListener("pointerleave",up);
}

function vMod(){
  $("#main").innerHTML=`<h2>${t("tabMod")}</h2><p class="sub">${t("modSub")}</p>
  <div class="grid">${S.pending.length?S.pending.map(p=>`<div class="mod"><div class="top">${thumb(p)}<div><h3 style="margin:0 0 4px;font-size:16px">${esc(L(p.name))}</h3>
    <div class="meta">${esc(tl(p.type))} · ${esc(rn(p.region))} · ${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}</div><div style="margin-top:6px">${pill(p.status)}</div></div></div>
    <p>${esc(L(p.desc))}</p><div class="meta">${t("reportedBy")} ${esc(p.author)}</div>
    ${p.photos.length?`<div class="photos">${p.photos.map(x=>`<img src="${x}" alt="">`).join("")}</div>`:""}
    <div class="row" style="margin-top:10px"><button class="btn teal small" data-ok="${p.id}">${t("approve")}</button><button class="btn ghost small" data-no="${p.id}">${t("reject")}</button></div></div>`).join(""):`<div class="empty">${t("queueEmpty")}</div>`}</div>
  <div class="box"><h4>${t("demoCtl")}</h4><p class="meta" style="margin:0 0 10px">${t("demoKept")}</p><button class="btn ghost small" id="reset">${t("reset")}</button></div>`;
  $("#main").querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{const i=S.pending.findIndex(p=>p.id===b.dataset.ok);const p=S.pending.splice(i,1)[0];
    S.sites.push({...p,id:"s"+Date.now(),conf:0,age:null});save();toast(t("approved"));renderChrome();vMod()});
  $("#main").querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>{S.pending=S.pending.filter(p=>p.id!==b.dataset.no);save();toast(t("rejected"));renderChrome();vMod()});
  $("#reset").onclick=()=>{S=JSON.parse(JSON.stringify(SEED));save();for(const k in chats)delete chats[k];toast(t("resetDone"));renderChrome();vMod()};
}

/* ---------- site card ---------- */
function openSheet(html){$("#sheet").innerHTML=html;$("#ov").classList.add("on");$("#sheet").scrollTop=0}
function closeSheet(){$("#ov").classList.remove("on");reopen=null}
$("#ov").onclick=e=>{if(e.target.id==="ov")closeSheet()};
function openSite(id){
  const s=site(id);if(!s)return;reopen=()=>openSite(id);
  const mine=S.mine[id];
  openSheet(`<div class="hero">${s.photos&&s.photos.length?`<img src="${s.photos[0]}" alt="">`:TYPES[s.type].icon}<button class="close" id="x">✕</button></div>
  <div class="in">
    <div class="meta">${TYPES[s.type].icon} ${esc(tl(s.type))} · ${esc(rfull(s.region))}</div>
    <h2>${esc(L(s.name))}</h2>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${pill(s.status)}${verified(s)?`<span class="vbadge">${t("verifiedBy",{n:s.conf})}</span>`:""}</div>
    <div class="ltabs" id="lt">${LANGS.map(l=>`<button class="${l[0]===lang?"on":""}" data-l="${l[0]}">${l[2]}</button>`).join("")}</div>
    <p class="desc">${esc(L(s.desc))}</p>
    ${s.problem&&s.status!=="green"&&s.status!=="blue"?`<div class="problem ${s.status==="yellow"?"y":""}">⚠️ ${esc(L(s.problem))}</div>`:""}
    ${s.status==="blue"?`<div class="problem" style="background:#D7E4F3">${t("restored")}</div>`:""}
    <div class="kv">📍 ${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}</div>
    <a class="srclink" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(L(s.name,"en")+" Kyrgyzstan")}" target="_blank" rel="noopener">${t("google")}</a>
    ${s.status==="red"?`<button class="btn" id="ap" style="margin-top:8px">🚨 ${t("createAppeal")}</button>`:""}

    <div class="box"><h4>${t("community")}</h4>
      <div class="meta">${verified(s)?t("isVerified"):t("confNeed",{n:s.conf})}</div>
      <div class="prog"><i style="width:${Math.min(100,s.conf/5*100)}%"></i></div>
      <button class="btn teal" id="conf" ${mine?"disabled":""}>${mine?t("confDone"):t("confBtn")}</button>
    </div>

    <div class="box"><h4>${t("talk")}</h4>
      <div class="chatlog" id="log"></div>
      <div class="chips">${["q1","q2","q3"].map(q=>`<button class="chip" data-q="${esc(t(q))}">${esc(t(q))}</button>`).join("")}</div>
      <form id="chatf" class="row" style="gap:6px"><input type="text" id="q" placeholder="${esc(t("askPh"))}" style="flex:3"><button class="btn small" style="flex:1">${t("ask")}</button></form>
      <div class="meta" style="margin-top:6px">${t("onlyFacts")}</div>
    </div>

    <div class="box"><h4>${t("modUpd")}</h4>
      <div class="row"><select id="st">${Object.keys(STATUS).map(k=>`<option value="${k}" ${k===s.status?"selected":""}>${esc(sl(k))}</option>`).join("")}</select><button class="btn ghost small" id="stb" style="flex:0 0 auto">${t("save")}</button></div>
    </div>
  </div>`);
  $("#x").onclick=closeSheet;
  $("#lt").onclick=e=>{const b=e.target.closest("button");if(!b)return;setLang(b.dataset.l)};
  if($("#ap"))$("#ap").onclick=()=>openAppeal(id);
  $("#conf").onclick=()=>{s.conf++;S.mine[id]=1;save();toast(s.conf===5?t("nowVer"):t("thanksConf"));render();openSite(id)};
  $("#stb").onclick=()=>{s.status=$("#st").value;save();toast(s.status==="blue"?t("markedSaved"):s.status==="red"?t("movedUrgent"):t("condUpd"));renderChrome();render();openSite(id)};
  drawChat(id);
  $("#sheet").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>ask(id,b.dataset.q));
  $("#chatf").onsubmit=e=>{e.preventDefault();const q=$("#q").value.trim();if(q){$("#q").value="";ask(id,q)}};
}
function drawChat(id){const log=$("#log");if(!log)return;const m=chats[id]||[];
  log.innerHTML=m.length?m.map(x=>`<div class="${x.r==="u"?"bu":"bm"}">${esc(x.t)}</div>`).join(""):`<div class="bm">${esc(t("greet",{name:L(site(id).name)}))}</div>`;log.scrollTop=log.scrollHeight}
function facts(s){return [`Name: ${L(s.name,"en")} (Russian: ${L(s.name,"ru")}; Kyrgyz: ${L(s.name,"ky")}; Chinese: ${L(s.name,"zh")})`,`Type: ${L(TYPES[s.type].lab,"en")}`,`Location: ${s.region} region, Kyrgyzstan; coordinates ${s.lat.toFixed(3)}, ${s.lon.toFixed(3)}`,
  `Description: ${L(s.desc,"en")}`,s.age?`Age: ${L(s.age,"en")}`:"Age: unknown",`Current condition (community reports): ${L(STATUS[s.status].lab,"en")}${s.problem&&s.status!=="green"?"; "+L(s.problem,"en"):""}`,`Confirmed by ${s.conf} visitors`].join("\n- ")}
async function ask(id,q){
  const s=site(id);chats[id]=chats[id]||[];chats[id].push({r:"u",t:q});chats[id].push({r:"m",t:"…"});drawChat(id);
  const m=chats[id], last=m[m.length-1];
  if(sampleFn){
    const hist=m.slice(0,-2).map(x=>(x.r==="u"?"Visitor: ":"Monument: ")+x.t).join("\n");
    const prompt=`You are the historical monument "${L(s.name,"en")}" in Kyrgyzstan. Speak in the first person, warmly and simply, to a visitor.
Rules: use ONLY the facts below. If they don't answer the question, say you don't know that yet. Never invent dates, names or numbers. Reply in the same language as the visitor's last message (Kyrgyz, Russian, English or Chinese). At most 3 short sentences. Plain text only.
Facts:
- ${facts(s)}
${hist?"Conversation so far:\n"+hist+"\n":""}Visitor: ${q}
Monument:`;
    try{const r=await sampleFn(prompt,{modelTier:"quick",cache:false,onText:({text})=>{last.t=text;drawChat(id)}});last.t=(r.text||last.t).trim();drawChat(id);return}
    catch(e){/* fall back to offline answer */}
  }
  last.t=offline(s,q);drawChat(id);
}
const OFF={
  age:{en:"About my age: {a}. {d}",ru:"Мой возраст: {a}. {d}",ky:"Менин жашым: {a}. {d}",zh:"关于我的年龄：{a}。{d}"},
  noAge:{en:"my card doesn’t say yet",ru:"в моей карточке этого пока нет",ky:"баракчамда азырынча жок",zh:"我的卡片上还没有记录"},
  build:{en:"{d} My card doesn’t say more about who built me yet.",ru:"{d} Больше о том, кто меня построил, в моей карточке пока нет.",ky:"{d} Мени ким курганы тууралуу баракчамда азырынча маалымат жок.",zh:"{d}关于是谁建造了我，我的卡片上还没有更多信息。"},
  cond:{en:"Right now my condition is: {c}. {p}",ru:"Сейчас моё состояние: {c}. {p}",ky:"Азыр менин абалым: {c}. {p}",zh:"我现在的状况：{c}。{p}"},
  other:{en:"{d} My card doesn’t have an answer to that yet.",ru:"{d} Об этом в моей карточке пока ничего нет.",ky:"{d} Бул тууралуу баракчамда азырынча маалымат жок.",zh:"{d}我的卡片上还没有这个问题的答案。"}
};
function offline(s,q){
  const x=q.toLowerCase();
  const lg=/[一-鿿]/.test(x)?"zh":/[а-яёөүң]/.test(x)?((lang==="ky"||/[өүң]/.test(x))?"ky":"ru"):"en";
  const f=(k,v)=>{let r=OFF[k][lg]||OFF[k].en;for(const n in v)r=r.split("{"+n+"}").join(v[n]);return r.trim()};
  const d=L(s.desc,lg), p=s.problem&&s.status!=="green"?L(s.problem,lg):"";
  if(/old|age|year|лет|возраст|жаш|多大|年龄/.test(x))return f("age",{a:s.age?L(s.age,lg):OFF.noAge[lg],d});
  if(/built|who|made|построил|кто|ким|курган|建/.test(x))return f("build",{d});
  if(/happen|condition|state|состоян|происход|абал|эмне болуп|怎么样|状况/.test(x))return f("cond",{c:L(STATUS[s.status].lab,lg).toLowerCase(),p});
  return f("other",{d});
}

/* ---------- appeal ---------- */
function appealText(s,o){
  const n=(s.photos||[]).length;
  const date=new Date().toLocaleDateString(o.lang==="en"?"en-GB":"ru-RU");
  const link=({ru:"[ссылка на карточку объекта]",ky:"[объекттин баракчасына шилтеме]"}[o.lang]||"[link to site card]"), coords=`${s.lat.toFixed(5)}, ${s.lon.toFixed(5)}`;
  const nm=L(s.name,o.lang);
  const pr=(s.problem&&(s.problem[o.lang]||s.problem.ru||s.problem.en||Object.values(s.problem)[0]))||"";
  const who=o.applicant||"____________";
  if(o.lang==="ru"){const rec=o.to==="min"?"Министерство культуры Кыргызской Республики":`Местная администрация (${REGIONS[s.region][0]} область)`;
    return `В ${rec}\nот ${who}\n\nОБРАЩЕНИЕ\nо необходимости защиты объекта историко-культурного наследия\n\nСообщаю, что объект «${nm}» (${TYPES[s.type].ru}), расположенный: ${REGIONS[s.region][0]} область, координаты ${coords}, находится в состоянии, угрожающем его сохранности.\n\nОписание проблемы: ${pr}\n\nСостояние объекта подтверждено пользователями платформы «Забытые места» (${s.conf} подтверждений). Фотографии прилагаются (${n} шт.). Карточка объекта: ${link}\n\nПрошу провести осмотр объекта, принять меры по его сохранению и сообщить о принятых мерах.\n\nДата: ${date}\nПодпись: ____________`}
  if(o.lang==="ky"){const rec=o.to==="min"?"Кыргыз Республикасынын Маданият министрлигине":`Жергиликтүү администрацияга (${REGIONS[s.region][1]} облусу)`;
    return `${rec}\n${who} тарабынан\n\nКАЙРЫЛУУ\nтарыхый-маданий мурас объектисин коргоо зарылдыгы жөнүндө\n\n«${nm}» (${TYPES[s.type].ky}) объектиси, жайгашкан жери: ${REGIONS[s.region][1]} облусу, координаттары ${coords}, сакталышына коркунуч туудурган абалда экенин билдирем.\n\nКөйгөйдүн сүрөттөмөсү: ${pr}\n\nОбъектинин абалын «Унутулган жерлер» платформасынын колдонуучулары тастыктаган (${s.conf} тастыктоо). Сүрөттөр тиркелет (${n} даана). Объектинин баракчасы: ${link}\n\nОбъектини текшерип, аны сактоо боюнча чара көрүүнү жана көрүлгөн чаралар тууралуу маалымдоону суранам.\n\nКүнү: ${date}\nКолу: ____________`}
  const rec=o.to==="min"?"Ministry of Culture of the Kyrgyz Republic":`Local administration (${s.region} region)`;
  return `To: ${rec}\nFrom: ${who}\n\nAPPEAL\non the need to protect a cultural heritage site\n\nI am reporting that the site “${nm}” (${L(TYPES[s.type].lab,"en").toLowerCase()}), located in ${s.region} region, coordinates ${coords}, is in a condition that threatens its preservation.\n\nProblem: ${pr}\n\nThe condition has been confirmed by users of the Forgotten Places platform (${s.conf} confirmations). Photos attached: ${n}. Site card: ${link}\n\nI ask you to inspect the site, take measures to preserve it, and inform me of the measures taken.\n\nDate: ${date}\nSignature: ____________`;
}
function openAppeal(id){
  const s=site(id);
  const o={lang:lang==="ky"?"ky":lang==="en"?"en":"ru",to:"min",applicant:""};
  S.appeals++;save();render();
  const draw=()=>{
    reopen=draw;
    const txt=appealText(s,o);
    openSheet(`<div class="in" style="position:relative"><button class="close" id="x" style="top:12px">✕</button>
      <div class="meta">${t("offAppeal")}</div><h2 style="padding-right:40px">${esc(L(s.name))}</h2>
      <div class="row"><div><label class="f">${t("to")}</label><select id="to"><option value="min" ${o.to==="min"?"selected":""}>${t("ministry")}</option><option value="loc" ${o.to==="loc"?"selected":""}>${t("localAdm")}</option></select></div>
      <div><label class="f">${t("letterLang")}</label><select id="al"><option value="ru" ${o.lang==="ru"?"selected":""}>Русский</option><option value="ky" ${o.lang==="ky"?"selected":""}>Кыргызча</option><option value="en" ${o.lang==="en"?"selected":""}>English</option></select></div></div>
      <label class="f">${t("yourName")}</label><input type="text" id="who" value="${esc(o.applicant)}" placeholder="${esc(t("fullName"))}">
      <label class="f">${t("ready")}</label><div class="appeal">${esc(txt)}</div>
      <div class="row" style="margin-top:12px"><button class="btn" id="cp">${t("copy")}</button>${downloads?`<button class="btn teal" id="dl">${t("download")}</button>`:""}</div>
      <a class="btn ghost" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="mailto:?subject=${encodeURIComponent((o.lang==="en"?"Appeal: ":o.lang==="ky"?"Кайрылуу: ":"Обращение: ")+L(s.name,o.lang))}&body=${encodeURIComponent(txt)}">${t("email")}</a>
      <p class="note">${t("emailNote")}</p></div>`);
    $("#x").onclick=closeSheet;
    $("#to").onchange=e=>{o.to=e.target.value;draw()};
    $("#al").onchange=e=>{o.lang=e.target.value;draw()};
    $("#who").onchange=e=>{o.applicant=e.target.value;draw()};
    $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(appealText(s,o));toast(t("copied"))}catch(e){toast(t("copyFail"))}};
    if($("#dl"))$("#dl").onclick=async()=>{
      const html=`<html><head><meta charset="utf-8"></head><body style="font-family:'Times New Roman';font-size:14pt;white-space:pre-wrap">${esc(appealText(s,o))}</body></html>`;
      try{await downloads.save({filename:`appeal-${s.id}.doc`,data:html});toast(t("savedFile"))}catch(e){toast(t("dlFail"))}};
  };
  draw();toast(t("appealCreated"));
}

renderChrome();render();

</script>
